<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-card.png, the link-preview image. Rasterize with headless Chrome at 1200x630. -->
  <defs>
    <style>
      @font-face { font-family: 'Major Mono Display'; src: url('../cv/fonts/MajorMonoDisplay-Regular.ttf'); }
      @font-face { font-family: 'Inconsolata'; font-weight: 300; src: url('../cv/fonts/Inconsolata-Light.ttf'); }
      @font-face { font-family: 'Inconsolata'; font-weight: 400; src: url('../cv/fonts/Inconsolata-Regular.ttf'); }
      .name    { font-family: 'Major Mono Display', monospace; font-size: 62px; fill: url(#cmy); }
      .kicker  { font-family: 'Inconsolata', monospace; font-weight: 400; font-size: 22px; letter-spacing: 0.22em; fill: #8a8a8a; }
      .tagline { font-family: 'Inconsolata', monospace; font-weight: 300; font-size: 23px; fill: #d8d8d8; }
      .url     { font-family: 'Inconsolata', monospace; font-weight: 400; font-size: 22px; letter-spacing: 0.12em; fill: #8a8a8a; }
    </style>
    <linearGradient id="cmy" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="713" y2="0">
      <stop offset="0" stop-color="#00e5e5"/>
      <stop offset="0.5" stop-color="#e500cc"/>
      <stop offset="1" stop-color="#e5d800"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="1"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#000"/>

  <!-- Portrait faces left, so it sits on the right and looks into the card -->
  <image xlink:href="portrait_bw_1_cmyk3_cropped.png" href="portrait_bw_1_cmyk3_cropped.png" x="760" y="-20" width="440" height="670"/>
  <rect x="760" y="0" width="80" height="630" fill="url(#fade)"/>

  <text class="kicker" x="80" y="212">CHARACTER SHEET</text>
  <text class="name" x="78" y="296">Alyssa M Adams</text>
  <!-- Rule spans the name's inked width and shares its gradient -->
  <rect x="80" y="330" width="633" height="3" fill="url(#cmy)"/>
  <text class="tagline" x="80" y="384">Physicist · Artificial life researcher</text>
  <text class="tagline" x="80" y="416">Creative technologist · Tokyo</text>
  <text class="url" x="80" y="540">ALYSSA-M-ADAMS.COM</text>
</svg>
